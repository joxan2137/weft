[package]
name = "weft"
version = "0.3.0"
description = "Weft, a desktop client for the opencode agent"
license = "MIT"
repository = "https://github.com/joxan2137/weft"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "weft_lib"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-store = "2.5"
tauri-plugin-window-state = "2.5"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "system-proxy", "socks"] }
uuid = { version = "1", features = ["v4"] }
fastrand = "2"
sha2 = "0.10"
base64 = "0.22"
flate2 = "1"
tar = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
process-wrap = { version = "10", features = ["tokio1"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
winreg = "0.55"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
